     /* === GLOBAL RESET === */
     * { margin:0; padding:0; box-sizing:border-box; }
     button { font:inherit; }
 
     /* ===========================================
        FIXED 16:9 STAGE: MANDATORY BASE STYLES
        Include this ENTIRE file in every presentation.
        Slides are authored at 1920×1080 and scaled as a whole.
        =========================================== */
 
     /* 1. Lock the browser viewport */
     html,
     body {
         width: 100%;
         height: 100%;
         margin: 0;
         overflow: hidden;
         background: var(--stage-bg, #000);
     }
 
     /* 2. Full-window deck viewport */
     .deck-viewport {
         position: fixed;
         inset: 0;
         overflow: hidden;
         background: var(--stage-bg, #000);
     }
 
     /* 3. Fixed 16:9 design canvas.
        JavaScript sets transform: translate(...) scale(...). */
     .deck-stage {
         position: absolute;
         left: 0;
         top: 0;
         width: 1920px;
         height: 1080px;
         overflow: hidden;
         transform-origin: 0 0;
         background: var(--slide-bg, #fff);
     }
 
     /* 4. Slides stack inside the fixed stage.
        Content must be laid out at 1920×1080, not reflowed per device. */
     .slide {
         position: absolute;
         inset: 0;
         width: 1920px;
         height: 1080px;
         overflow: hidden;
         display: block;
         visibility: hidden;
         opacity: 0;
         pointer-events: none;
         background: var(--slide-bg, #fff);
     }
 
     .slide.active,
     .slide.visible {
         visibility: visible;
         opacity: 1;
         pointer-events: auto;
         z-index: 1;
     }
 
     /* 5. Keep media inside authored slide bounds */
     img,
     video,
     canvas,
     svg {
         max-width: 100%;
         max-height: 100%;
     }
 
     /* 6. Presentation chrome stays outside the slide design system */
     .deck-controls {
         position: fixed;
         left: 50%;
         bottom: 22px;
         transform: translateX(-50%);
         z-index: 1000;
     }
 
     /* 7. Print one fixed-size slide per page */
     @media print {
         html,
         body {
             width: 1920px;
             height: auto;
             overflow: visible;
             background: #fff;
         }
 
         .deck-viewport {
             position: static;
             overflow: visible;
             background: #fff;
         }
 
         .deck-stage {
             position: static;
             width: auto;
             height: auto;
             transform: none !important;
             background: none;
         }
 
         .slide {
             position: relative;
             display: block !important;
             visibility: visible !important;
             opacity: 1 !important;
             pointer-events: auto !important;
             width: 1920px;
             height: 1080px;
             break-after: page;
             page-break-after: always;
         }
 
         .slide:last-child {
             break-after: auto;
             page-break-after: auto;
         }
 
         .deck-controls {
             display: none !important;
         }
     }
 
     /* 8. Reduced motion */
     @media (prefers-reduced-motion: reduce) {
         *,
         *::before,
         *::after {
             animation-duration: 0.01ms !important;
             transition-duration: 0.2s !important;
         }
     }
 
     /* === SWISS MODERN ATMOSPHERE === */
     .slide::before {
       content:"";
       position:absolute;
       inset:0;
       background-image:
         linear-gradient(rgba(16,18,20,.055) 1px, transparent 1px),
         linear-gradient(90deg, rgba(16,18,20,.055) 1px, transparent 1px);
       background-size:80px 80px;
       mask-image:linear-gradient(to bottom, rgba(0,0,0,.75), transparent 78%);
       pointer-events:none;
     }
     .slide > * { position:absolute; }
     .reveal {
       opacity:0;
       transform:translateY(28px);
       transition:opacity var(--duration-normal) var(--ease-out-expo), transform var(--duration-normal) var(--ease-out-expo);
     }
    .slide.visible .reveal, .slide.active .reveal { opacity:1; transform:translateY(0); }
    .slide.visible .reveal:nth-child(2), .slide.active .reveal:nth-child(2) { transition-delay:.10s; }
    .slide.visible .reveal:nth-child(3), .slide.active .reveal:nth-child(3) { transition-delay:.18s; }
    .slide.visible .reveal:nth-child(4), .slide.active .reveal:nth-child(4) { transition-delay:.26s; }
    .slide.visible .reveal:nth-child(5), .slide.active .reveal:nth-child(5) { transition-delay:.34s; }
    .slide.visible .reveal:nth-child(6), .slide.active .reveal:nth-child(6) { transition-delay:.42s; }

         '<div class="section-id reveal">' + section.id + '</div>' +

     function imageGroups(section) {

           if (itemByNumber.has(number)) groupItems.push(itemByNumber.get(number));

         return { assets:group[2], items:groupItems };
       });

     function groupTitle(group) {
       const categories = [];

     function cardRows(group, cardId) {

     function productCard(group, cardIndex, slideIndex, section) {

         '<div class="product-card-table">' + cardRows(group, cardId) + '</div>' +

     function cardSlide(section, groups, chunkIndex) {

       const slide = addSlide("card-catalog-slide",

         '<div class="card-wintech-brand"><img src="assets/source-media/image1.jpeg" alt="Wintech Green Tomorrow" /></div>' +
         '<div class="card-header-rule"></div>' +
         '<div class="card-eyebrow reveal">' + editable("card-catalog-" + section.id + "-" + chunkIndex + "-eyebrow", "БҮЛЭГ " + section.id + " · GENERAL FITTINGS") + '</div>' +
         '<h2 class="card-title reveal">' + editable("card-catalog-" + section.id + "-" + chunkIndex + "-title", section.title) + '</h2>' +
         '<p class="card-subtitle reveal">' + editable("card-catalog-" + section.id + "-" + chunkIndex + "-subtitle", section.subtitle) + '</p>' +
         '<div class="card-range reveal">' + editable("card-catalog-" + section.id + "-" + chunkIndex + "-range", "Бүтээгдэхүүн № " + firstNo + " — " + lastNo) + '</div>' +
         '<div class="value-rail">' +
           '<div class="value-item"><span class="value-icon">✓</span><span>Найдвартай<br>чанар</span></div>' +
           '<div class="value-item"><span class="value-icon">⚙</span><span>Төрөл бүрийн<br>хэмжээ</span></div>' +
           '<div class="value-item"><span class="value-icon">◎</span><span>Мэргэжлийн<br>шийдэл</span></div>' +
           '<div class="value-item"><span class="value-icon">⌁</span><span>Үйлчилгээний<br>дэмжлэг</span></div>' +
         '</div>' +
         '<div class="card-grid">' + cards + '</div>' +
         '<div class="card-footer">' + editable("card-catalog-" + section.id + "-" + chunkIndex + "-footer", "ВИНТЕХ ХХК · Албан ёсны борлуулагч") + '</div>' +

       '<div class="details reveal"><strong>' + editable("contact-distributor",CONTEXT.meta.distributor) + '</strong><br>' + editable("contact-address",CONTEXT.meta.address) + '<br>' + editable("contact-phones","Утас: " + CONTEXT.meta.phones) + '</div>' +
       '<img class="flag reveal" src="assets/italy-flag.png" alt="Italy flag" />' +
       '<div class="contact-side reveal">GENERAL<br>FITTINGS<span>2026 / 2 · Улаанбаатар</span></div>' +

     /* === PAGE MARKS AND INITIAL VISIBILITY === */
     const slides = Array.from(document.querySelectorAll(".slide"));
     const totalSlides = slides.length;

     /* === SLIDE PRESENTATION CONTROLLER === */
     class SlidePresentation {
       constructor() {
         this.slides = slides;
         this.currentSlide = 0;
         this.stage = document.getElementById("deckStage");
         this.isWheelLocked = false;
         this.setupStageScale();
         this.setupKeyboardNav();
         this.setupTouchNav();
         this.setupMobileTapNav();
         this.setupWheelNav();
         this.setupButtons();
         this.showSlide(0);
       }
       setupStageScale() {
         const scale = () => {
           const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
           const x = (window.innerWidth - 1920 * factor) / 2;
           const y = (window.innerHeight - 1080 * factor) / 2;
           this.stage.style.transform = "translate(" + x + "px," + y + "px) scale(" + factor + ")";
         };
         scale();
         window.addEventListener("resize", scale);
       }
       setupKeyboardNav() {
         document.addEventListener("keydown", (event) => {
           if (event.target && event.target.getAttribute && event.target.getAttribute("contenteditable") === "true") {
             if (event.key === "Escape") event.target.blur();
             return;
           }
           if (["ArrowRight","ArrowDown","PageDown"," "].includes(event.key)) { event.preventDefault(); this.next(); }
           if (["ArrowLeft","ArrowUp","PageUp"].includes(event.key)) { event.preventDefault(); this.prev(); }
           if (event.key === "Home") { event.preventDefault(); this.showSlide(0); }
           if (event.key === "End") { event.preventDefault(); this.showSlide(this.slides.length - 1); }
         });
       }
       setupTouchNav() {
         let startX = 0; let startY = 0; let touchInTable = false;
         this.stage.addEventListener("touchstart", (event) => {
           touchInTable = Boolean(event.target.closest(".product-card-table"));
           const t = event.changedTouches[0]; startX = t.clientX; startY = t.clientY;
         }, {passive:true});
         this.stage.addEventListener("touchend", (event) => {
           if (touchInTable) { touchInTable = false; return; }
           const t = event.changedTouches[0]; const dx = t.clientX - startX; const dy = t.clientY - startY;
           if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? this.next() : this.prev();
         }, {passive:true});
       }
       setupMobileTapNav() {
         this.stage.addEventListener("click", (event) => {
           if (!window.matchMedia("(max-width: 900px), (pointer: coarse)").matches) return;
           if (event.target.closest("button, a, input, select, textarea, [contenteditable='true'], .product-card-table")) return;
           this.next();
         });
       }
       setupWheelNav() {
         this.stage.addEventListener("wheel", (event) => {
           if (event.target.closest(".product-card-table")) return;
           if (this.isWheelLocked) return;
           if (Math.abs(event.deltaY) < 18) return;
           this.isWheelLocked = true;
           event.deltaY > 0 ? this.next() : this.prev();
           window.setTimeout(() => { this.isWheelLocked = false; }, 520);
         }, {passive:true});
       }
       setupButtons() {
         document.getElementById("prevButton").addEventListener("click", () => this.prev());
         document.getElementById("nextButton").addEventListener("click", () => this.next());
       }
       showSlide(index) {
         this.currentSlide = Math.max(0, Math.min(index, this.slides.length - 1));
         this.slides.forEach((slide, i) => {
           slide.classList.toggle("active", i === this.currentSlide);
           slide.classList.toggle("visible", i === this.currentSlide);
         });
         document.getElementById("slideCounter").textContent = pageText(this.currentSlide + 1, this.slides.length);
         document.getElementById("progressFill").style.width = ((this.currentSlide + 1) / this.slides.length * 100) + "%";
         if (window.audioDirector) window.audioDirector.onSlideChange(this.currentSlide);
       }
       next() { this.showSlide(this.currentSlide + 1); }
       prev() { this.showSlide(this.currentSlide - 1); }
     }

     /* === SOUND DESIGN === */
     const SOUND_PROFILES = {
       cover:    { a:78,  b:117, type:"sine",     filter:520 },
       overview: { a:86,  b:129, type:"sine",     filter:560 },
       "01":     { a:132, b:198, type:"triangle", filter:980 },
       "02":     { a:88,  b:132, type:"sine",     filter:640 },
       "03":     { a:174, b:261, type:"sine",     filter:760 },
       "04":     { a:62,  b:93,  type:"sawtooth", filter:390 },
       contact:  { a:72,  b:108, type:"triangle", filter:460 }
     };
     const TRANSITION_SOUNDS = {
       cover:"assets/audio/transition-cinematic.mp3",
       overview:"assets/audio/transition-sweep.mp3",
       "01":"assets/audio/transition-cinematic.mp3",
       "02":"assets/audio/transition-fast.mp3",
       "03":"assets/audio/transition-sweep.mp3",
       "04":"assets/audio/transition-impact.mp3",
       contact:"assets/audio/transition-cinematic.mp3"
     };
     class AudioDirector {
       constructor() {
         this.enabled = false;
         this.ctx = null;
         this.master = null;
         this.ambientSources = [];
         this.activeSection = "";
         this.lastSlide = -1;
         this.transitionPlayer = new Audio();
         this.transitionPlayer.preload = "auto";
         this.toggle = document.getElementById("audioToggle");
         this.status = document.getElementById("audioStatus");
         this.toggle.addEventListener("click", () => this.toggleSound());
         document.addEventListener("keydown", (event) => {
           if ((event.key === "m" || event.key === "M") && !(event.target && event.target.getAttribute && event.target.getAttribute("contenteditable"))) {
             event.preventDefault();
             this.toggleSound();
           }
         });
       }
       getSection(index) {
         const slide = slides[index];
         if (!slide) return "cover";
         return slide.dataset.sectionId || (slide.classList.contains("overview") ? "overview" : slide.classList.contains("contact") ? "contact" : "cover");
       }
       ensureContext() {
         const AudioContext = window.AudioContext || window.webkitAudioContext;
         if (!AudioContext) {
           this.status.textContent = "AUDIO UNSUPPORTED";
           return false;
         }
         if (!this.ctx) {
           this.ctx = new AudioContext();
           this.master = this.ctx.createGain();
           this.master.gain.value = .22;
           this.master.connect(this.ctx.destination);
         }
         if (this.ctx.state === "suspended") this.ctx.resume();
         return true;
       }
       toggleSound() {
         if (this.enabled) this.disable();
         else this.enable();
       }
       enable() {
         if (!this.ensureContext()) return;
         this.enabled = true;
         this.toggle.textContent = "SOUND ON";
         this.status.textContent = "MUSIC LIVE · M OFF";
         const current = window.presentation ? window.presentation.currentSlide : 0;
         this.syncAmbient(current);
         this.lastSlide = current;
       }
       disable() {
         this.enabled = false;
         this.stopAmbient();
         this.transitionPlayer.pause();
         this.transitionPlayer.currentTime = 0;
         this.toggle.textContent = "SOUND OFF";
         this.status.textContent = "MUSIC READY";
       }
       makeNoiseBuffer() {
         const length = this.ctx.sampleRate * 2;
         const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
         const data = buffer.getChannelData(0);
         for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * .55;
         return buffer;
       }
       addOscillator(bus, profile, frequency, type, volume, detune) {
         const source = this.ctx.createOscillator();
         const gain = this.ctx.createGain();
         source.type = type;
         source.frequency.value = frequency;
         source.detune.value = detune || 0;
         gain.gain.value = volume;
         source.connect(gain);
         gain.connect(bus);
         source.start();
         this.ambientSources.push({source, gain});
       }
       syncAmbient(index) {
         if (!this.enabled || !this.ensureContext()) return;
         const section = this.getSection(index);
         if (section === this.activeSection) return;
         this.stopAmbient();
         const profile = SOUND_PROFILES[section] || SOUND_PROFILES.cover;
         const bus = this.ctx.createGain();
         const filter = this.ctx.createBiquadFilter();
         bus.gain.value = .72;
         filter.type = "lowpass";
         filter.frequency.value = profile.filter;
         filter.Q.value = .55;
         bus.connect(filter);
         filter.connect(this.master);
         this.addOscillator(bus, profile, profile.a, profile.type, .020, -3);
         this.addOscillator(bus, profile, profile.b, "sine", .012, 4);
         const noise = this.ctx.createBufferSource();
         const noiseGain = this.ctx.createGain();
         noise.buffer = this.makeNoiseBuffer();
         noise.loop = true;
         noiseGain.gain.value = section === "04" ? .004 : .007;
         noise.connect(noiseGain);
         noiseGain.connect(filter);
         noise.start();
         this.ambientSources.push({source:noise, gain:noiseGain});
         this.activeSection = section;
       }
       stopAmbient() {
         const oldSources = this.ambientSources;
         this.ambientSources = [];
         this.activeSection = "";
         oldSources.forEach(({source, gain}) => {
           try {
             gain.gain.cancelScheduledValues(this.ctx.currentTime);
             gain.gain.setTargetAtTime(0, this.ctx.currentTime, .16);
             window.setTimeout(() => { try { source.stop(); source.disconnect(); } catch (error) {} }, 520);
           } catch (error) {}
         });
       }
       playTransition(index) {
         if (!this.enabled) return;
         const section = this.getSection(index);
         const source = TRANSITION_SOUNDS[section] || TRANSITION_SOUNDS.cover;
         this.transitionPlayer.pause();
         if (!this.transitionPlayer.src.endsWith(source)) this.transitionPlayer.src = source;
         this.transitionPlayer.currentTime = 0;
         this.transitionPlayer.volume = .18;
         this.transitionPlayer.play().catch(() => {});
       }
       onSlideChange(index) {
         if (!this.enabled) return;
         if (this.lastSlide !== -1 && this.lastSlide !== index) this.playTransition(index);
         this.syncAmbient(index);
         this.lastSlide = index;
       }
     }

     /* === INLINE EDITOR === */
     class InlineEditor {
       constructor() {
         this.isActive = false;
         this.editToggle = document.getElementById("editToggle");
         this.banner = document.getElementById("editBanner");
         this.restore();
         this.bind();
       }
       bind() {
         this.editToggle.addEventListener("click", () => this.toggleEditMode());
         const hotzone = document.querySelector(".edit-hotzone");
         let hideTimeout = null;
         hotzone.addEventListener("mouseenter", () => { clearTimeout(hideTimeout); this.editToggle.classList.add("show"); });
         hotzone.addEventListener("mouseleave", () => { hideTimeout = setTimeout(() => { if (!this.isActive) this.editToggle.classList.remove("show"); }, 400); });
         this.editToggle.addEventListener("mouseenter", () => clearTimeout(hideTimeout));
         this.editToggle.addEventListener("mouseleave", () => { hideTimeout = setTimeout(() => { if (!this.isActive) this.editToggle.classList.remove("show"); }, 400); });
         hotzone.addEventListener("click", () => this.toggleEditMode());
         document.addEventListener("keydown", (event) => {
           if ((event.key === "e" || event.key === "E") && !(event.target && event.target.getAttribute && event.target.getAttribute("contenteditable"))) this.toggleEditMode();
           if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") { event.preventDefault(); this.saveCopy(); }
         });
         document.addEventListener("input", (event) => {
           const target = event.target;
           if (target && target.getAttribute && target.getAttribute("contenteditable") === "true") {
             const id = target.getAttribute("data-editable");
             if (id) { const saved = JSON.parse(localStorage.getItem("gf-2026-edits") || "{}"); saved[id] = target.innerHTML; localStorage.setItem("gf-2026-edits", JSON.stringify(saved)); }
           }
         });
       }
       toggleEditMode() {
         this.isActive = !this.isActive;
         this.editToggle.classList.toggle("active", this.isActive);
         this.banner.classList.toggle("active", this.isActive);
         document.querySelectorAll("[data-editable]").forEach((element) => element.setAttribute("contenteditable", this.isActive ? "true" : "false"));
         if (!this.isActive) this.editToggle.classList.remove("show");
       }
       restore() {
         const saved = JSON.parse(localStorage.getItem("gf-2026-edits") || "{}");
         document.querySelectorAll("[data-editable]").forEach((element) => {
           const id = element.getAttribute("data-editable");
           if (saved[id]) element.innerHTML = saved[id];
         });
       }
       saveCopy() {
         const blob = new Blob(["<!DOCTYPE html>\n" + document.documentElement.outerHTML], {type:"text/html"});
         const link = document.createElement("a");
         link.href = URL.createObjectURL(blob);
         link.download = "general-fittings-2026-edited.html";
         link.click();
         URL.revokeObjectURL(link.href);
       }
     }
 
     /* === BOOT === */
     window.audioDirector = new AudioDirector();
     window.presentation = new SlidePresentation();
     window.editor = new InlineEditor();
   </script>
